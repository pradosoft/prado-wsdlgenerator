name: Wsdl Generator
on: [push, pull_request]
jobs:
  wsdlgenerator:
    name: Wsdl Generator (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          # soap is not required by the package; it backs the tests that read a
          # generated document the way a client does.
          extensions: dom, pcre, soap, spl
          coverage: xdebug
          tools: php-cs-fixer, cs2pr

      - name: Validate composer.json
        run: composer validate --strict

      - name: Validate code syntax using php-cs-fixer
        run: php-cs-fixer check --using-cache=no --format=checkstyle | cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run Unit Tests
        run: composer unittest
        env:
          XDEBUG_MODE: coverage
